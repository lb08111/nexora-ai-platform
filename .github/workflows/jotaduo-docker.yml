name: Jotaduo Docker Build & Push

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "console/**"
      - "deploy/**"
      - "alembic/**"
      - "pyproject.toml"
      - "setup.py"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: "latest"
        type: string

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository_owner }}/jotaduo-platform
  ACR_REGISTRY: crpi-n1l0skbmprpjqh57.cn-shenzhen.personal.cr.aliyuncs.com
  ACR_IMAGE: leo-jotaduo-platform/jotaduo-platform

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check ACR credentials
        id: acr_creds
        run: |
          if [ -n "${{ secrets.ALIYUN_ACR_USERNAME }}" ] && [ -n "${{ secrets.ALIYUN_ACR_PASSWORD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ALIYUN_ACR_USERNAME/ALIYUN_ACR_PASSWORD not set; skipping Aliyun ACR login and push"
          fi

      - name: Log in to Alibaba Cloud ACR
        if: steps.acr_creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Determine tags
        id: tags
        run: |
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date +%Y%m%d)
          TAGS="${GHCR_REGISTRY}/${GHCR_IMAGE}:${TAG}"
          TAGS="${TAGS},${GHCR_REGISTRY}/${GHCR_IMAGE}:${DATE}-${SHORT_SHA}"
          if [ "${{ steps.acr_creds.outputs.available }}" = "true" ]; then
            TAGS="${TAGS},${ACR_REGISTRY}/${ACR_IMAGE}:${TAG}"
            TAGS="${TAGS},${ACR_REGISTRY}/${ACR_IMAGE}:${DATE}-${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            JOTADUO_DISABLED_CHANNELS=imessage
          cache-from: type=gha
          cache-to: type=gha,mode=max
