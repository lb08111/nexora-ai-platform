repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/)'
      - id: sort-simple-yaml
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/)'
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: |
          (?x)^(
              meta.yaml
              |\.claude/homunculus/.*
          )$
      - id: check-xml
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/)'
      - id: check-toml
      - id: check-docstring-first
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/)'
      - id: check-json
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/)'
      - id: fix-encoding-pragma
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/)'
      - id: detect-private-key
      - id: trailing-whitespace
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/)'
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/)'
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.0
    hooks:
      - id: mypy
        exclude:
          (?x)(
          pb2\.py$
          | grpc\.py$
          | ^docs
          | \.html$
          | .*/skills/.*
          | ^e2e/
          | ^plugins/bundle/[^/]*-[^/]*/
          )
        args: [
          --ignore-missing-imports,
          --disable-error-code=var-annotated,
          --disable-error-code=union-attr,
          --disable-error-code=assignment,
          --disable-error-code=attr-defined,
          --disable-error-code=import-untyped,
          --disable-error-code=truthy-function,
          --disable-error-code=func-returns-value,
          --disable-error-code=index,
          --disable-error-code=arg-type,
          --disable-error-code=no-redef,
          --follow-imports=skip,
          --explicit-package-bases,
        ]
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        args: [ --line-length=79 ]
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/)'
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [ "--extend-ignore=E203,E501"]
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/)'
  - repo: https://github.com/pylint-dev/pylint
    rev: v3.0.2
    hooks:
      - id: pylint
        exclude:
          (?x)(
          ^docs
          | pb2\.py$
          | grpc\.py$
          | \.demo$
          | \.md$
          | \.html$
          | .*/skills/.*
          | ^e2e/
          )
        args: [
          --disable=W0511,
          --disable=W0718,
          --disable=W0122,
          --disable=C0103,
          --disable=R0913,
          --disable=E0401,
          --disable=E1101,
          --disable=C0415,
          --disable=W0603,
          --disable=R1705,
          --disable=R0914,
          --disable=E0601,
          --disable=W0602,
          --disable=W0604,
          --disable=R0801,
          --disable=R0902,
          --disable=R0903,
          --disable=C0123,
          --disable=W0231,
          --disable=W1113,
          --disable=W0221,
          --disable=R0401,
          --disable=W0632,
          --disable=W0123,
          --disable=C3001,
          --disable=W0201,
          --disable=C0302,
          --disable=W1203,
          --disable=C2801,
          --disable=C0114,  # Disable missing module docstring for quick dev
          --disable=C0115,  # Disable missing class docstring for quick dev
          --disable=C0116,  # Disable missing function or method docstring for quick dev
          --disable=W0212,  # protected-access (tests touch internals)
          --disable=C0411,  # wrong-import-order
          --disable=W0613,  # unused-argument
          --disable=W0611,  # unused-import
          --disable=E0611,  # no-name-in-module (false positives w/ namespace pkgs)
          --disable=R0402,  # consider-using-from-import
          --disable=W0621,  # redefined-outer-name (common in pytest fixtures)
          --disable=C0413,  # wrong-import-position
          --disable=E0603,  # undefined-all-variable (false positives)
          --disable=W0404,  # reimported
          --disable=C1803,  # use-implicit-booleaness-not-comparison-to-string
          --disable=R0911,  # too-many-return-statements
          --disable=R0912,  # too-many-branches
          --disable=W0108,  # unnecessary-lambda
          --disable=W0622,  # redefined-builtin
          --disable=E1102,  # not-callable (often false positive on decorators)
          --disable=R0915,  # too-many-statements
          --disable=E1123,  # unexpected-keyword-arg (false positive on dataclasses)
          --disable=E1120,  # no-value-for-parameter (false positive on dataclasses)
          --disable=E1121,  # too-many-function-args
          --disable=W0612,  # unused-variable
          --disable=C0301,  # line-too-long (flake8 already configured)
          --disable=F0002,  # astroid-error (pylint internal crash — upstream bug)
          --disable=E0402,  # relative-beyond-top-level (hyphen plugin dirs not in package path)
          --disable=C0412,  # ungrouped-imports (try/except import patterns)
        ]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: 'v3.0.0'
    hooks:
      - id: prettier
        additional_dependencies: [ 'prettier@3.0.0' ]
        files: \.(tsx?)$
        exclude: '(?x)(^web/|^console/|/dist/|.*/skills/.*|^scripts/pack/)'