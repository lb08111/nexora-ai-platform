volumes:
  jotaduo-data:
    name: jotaduo-data
  jotaduo-secrets:
    name: jotaduo-secrets
  jotaduo-backups:
    name: jotaduo-backups
  jotaduo-postgres:
    name: jotaduo-postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: jotaduo-postgres
    restart: unless-stopped
    cpus: "${JOTADUO_POSTGRES_CPUS:-1.0}"
    mem_limit: "${JOTADUO_POSTGRES_MEMORY_LIMIT:-1g}"
    environment:
      POSTGRES_DB: "${JOTADUO_POSTGRES_DB:-jotaduo}"
      POSTGRES_USER: "${JOTADUO_POSTGRES_USER:-jotaduo}"
      POSTGRES_PASSWORD: "${JOTADUO_POSTGRES_PASSWORD:-jotaduo_dev_password}"
    volumes:
      - jotaduo-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${JOTADUO_POSTGRES_USER:-jotaduo} -d ${JOTADUO_POSTGRES_DB:-jotaduo}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  jotaduo:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: jotaduo-platform:latest
    container_name: jotaduo-platform
    restart: unless-stopped
    cpus: "${JOTADUO_APP_CPUS:-2.0}"
    mem_limit: "${JOTADUO_APP_MEMORY_LIMIT:-4g}"
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      JOTADUO_AUTH_ENABLED: "true"
      JOTADUO_PORT: "8088"
      JOTADUO_WORKING_DIR: "/app/working"
      JOTADUO_SECRET_DIR: "/app/working.secret"
      JOTADUO_BACKUP_DIR: "/app/working.backups"
      JOTADUO_OPENAPI_DOCS: "false"
      JOTADUO_MAX_ACTIVE_AGENTS: "${JOTADUO_MAX_ACTIVE_AGENTS:-20}"
      JOTADUO_AGENT_IDLE_TTL_SECONDS: "${JOTADUO_AGENT_IDLE_TTL_SECONDS:-3600}"
      JOTADUO_DB_URL: "postgresql+psycopg2://${JOTADUO_POSTGRES_USER:-jotaduo}:${JOTADUO_POSTGRES_PASSWORD:-jotaduo_dev_password}@postgres:5432/${JOTADUO_POSTGRES_DB:-jotaduo}"
    volumes:
      - jotaduo-data:/app/working
      - jotaduo-secrets:/app/working.secret
      - jotaduo-backups:/app/working.backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/version', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
